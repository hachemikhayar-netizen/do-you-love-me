<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me?</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at center,#fff5f7 0%,#ffd9e2 45%,#ffb6c8 100%);
}
.container{text-align:center;padding:24px;width:100%;max-width:520px}
.question{
  font-size:clamp(34px,9vw,58px);font-weight:800;
  color:#5b1022;margin-bottom:38px;
  animation:fadeIn .9s ease both;
}
.buttons{display:flex;gap:18px;justify-content:center}
button{
  border:0;border-radius:999px;padding:16px 32px;
  font-size:20px;font-weight:700;cursor:pointer;
  min-width:130px;box-shadow:0 8px 20px #8c183533;
  transition:transform .2s ease;
}
button:active{transform:scale(.94)}
.yes{background:#e9234f;color:white}
.no{background:white;color:#c91d46}
.result{display:none;animation:fadeIn .7s ease both}
.result h2{font-size:30px;color:#6b1028;margin:0 0 20px}
.heart-wrap{width:min(72vw,340px);margin:auto}
svg{width:100%;height:auto;overflow:visible}
.heart{
  fill:none;stroke:#ed1747;stroke-width:5;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1000;stroke-dashoffset:1000;
  animation:draw 2.2s ease forwards,fillHeart .8s 2s ease forwards;
}
.spark{fill:#ff5276;opacity:0;animation:float 2.5s ease-in-out infinite}
.s1{animation-delay:.2s}.s2{animation-delay:.7s}.s3{animation-delay:1.1s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillHeart{to{fill:#ed1747}}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{opacity:0;transform:translateY(10px) scale(.7)}50%{opacity:1;transform:translateY(-12px) scale(1)}}
</style>
</head>
<body>
<main class="container">
  <section id="question">
    <div class="question">Do you love me? 💗</div>
    <div class="buttons">
      <button class="yes" type="button">YES ❤️</button>
      <button class="no" type="button">NO 💔</button>
    </div>
  </section>

  <section id="result" class="result" aria-live="polite">
    <h2 id="message">My heart has an answer ❤️</h2>
    <div class="heart-wrap">
      <svg viewBox="0 0 300 280" role="img" aria-label="Animated red heart">
        <path class="heart"
          d="M150 245
             C130 225 45 165 45 95
             C45 48 100 25 135 60
             L150 77
             L165 60
             C200 25 255 48 255 95
             C255 165 170 225 150 245 Z"/>
        <circle class="spark s1" cx="45" cy="70" r="5"/>
        <circle class="spark s2" cx="255" cy="65" r="5"/>
        <circle class="spark s3" cx="150" cy="25" r="5"/>
      </svg>
    </div>
  </section>
</main>

<script>
const question=document.getElementById("question");
const result=document.getElementById("result");
const message=document.getElementById("message");

document.querySelector(".yes").addEventListener("click",showHeart);
document.querySelector(".no").addEventListener("click",showHeart);

function showHeart(){
  question.style.display="none";
  result.style.display="block";
  message.textContent="My heart has an answer ❤️";
}
</script>
</body>
</html>
